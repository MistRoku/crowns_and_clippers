# CI: build the client + API, run backend unit tests, then run the
# end-to-end smoke + security suite against a live local API.
# The tenant/notification suites need a FRESH database and stay manual
# (see docs/04-testing-checklist.md); only smoke-test.mjs runs here.
name: CI

on:
  push:
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build server/CrownAndClipper.Api/CrownAndClipper.Api.csproj --nologo
      - run: dotnet test server/CrownAndClipper.Tests/CrownAndClipper.Tests.csproj --nologo
      - name: Start API in background
        run: dotnet run --project server/CrownAndClipper.Api --no-build --urls http://localhost:5000 &
      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/health; then exit 0; fi
            sleep 2
          done
          echo "API did not become healthy in time" >&2
          exit 1
      - name: Run smoke + security tests
        run: node smoke-test.mjs
        env:
          API_BASE: http://localhost:5000
